name: release

# Tag a commit and this publishes it. There is no API token in this
# repository and there is not meant to be one: PyPI trusted publishing signs
# the upload with a short-lived OIDC identity minted for this workflow run.
#
# A tool that flags packages for shipping without build provenance has no
# business shipping without build provenance. The publish step attaches PEP 740
# attestations, so `hemlock scan --online` run against hemlock itself passes
# its own HEM601.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The tag is what a person reads; hemlock/__init__.py is what the wheel
      # carries. Those two drifted once already and shipped a wheel labelled
      # with the previous release.
      - name: the tag must match the package version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import hemlock; print(hemlock.__version__)")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match hemlock $version"
            exit 1
          fi
          echo "publishing $version"

      - run: pip install -e ".[dev]"
      - run: ruff check hemlock tests
      - run: pytest -q

      - name: the known-bad fixture must still be caught
        run: |
          hemlock scan examples/compromised-app --fail-on critical && {
            echo "::error::refusing to release: the fixture stopped being flagged"
            exit 1
          } || echo "fixture flagged as expected"

      - run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hemlock-scan
    permissions:
      # The only credential involved. A stored token is a secret that can be
      # stolen, and this project exists because publish credentials get stolen.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  # Depends on build, not on publish. v0.5.0 built a correct wheel and then
  # produced no release at all, because the PyPI trusted publisher had not
  # been registered yet and github-release was queued behind it. The two are
  # separate distribution channels and one being misconfigured is not a
  # reason to withhold the other, least of all while PyPI is still empty and
  # the GitHub release is the only place the artifacts exist.
  github-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME" --generate-notes
