name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # The online rules talk to live registries. A weekly run catches it when
    # a registry changes a response shape under us.
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check hemlock tests
      - run: pytest -q

  detection:
    # The fixture is a known-bad project. If hemlock stops flagging it, the
    # rules regressed, and that should break the build louder than a unit test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: fixture must be flagged critical
        run: |
          hemlock scan examples/compromised-app --fail-on critical && {
            echo "::error::hemlock did not flag the known-bad fixture"
            exit 1
          } || echo "fixture flagged as expected"
      - name: clean project must pass
        run: |
          mkdir -p /tmp/clean
          printf 'requests==2.32.3\n' > /tmp/clean/requirements.txt
          hemlock scan /tmp/clean --fail-on low
      - name: diff must flag only what a change adds
        run: |
          git -C /tmp/clean init -q
          git -C /tmp/clean -c user.name=ci -c user.email=ci@ci add -A
          git -C /tmp/clean -c user.name=ci -c user.email=ci@ci commit -qm base
          printf 'requsts==2.28.0\n' >> /tmp/clean/requirements.txt
          hemlock diff --since HEAD --path /tmp/clean --fail-on medium && {
            echo "::error::hemlock diff did not flag the added typosquat"
            exit 1
          } || echo "typosquat flagged as expected"
      # Offline, so it exercises the plumbing without depending on PyPI or
      # the GitHub API being up. --check can never install anything.
      - name: update never installs on its own
        run: hemlock update --check

      - name: check judges a bare name
        run: |
          hemlock check colorz --fail-on medium && {
            echo "::error::hemlock check did not flag a typosquat"
            exit 1
          } || echo "typosquat flagged as expected"
          hemlock check lodash --fail-on low

      # --fail-on never, because this step wants the file, not the verdict.
      # The fixture is known-bad, so a scan of it exits 1 by design, and the
      # step above is the one that asserts that.
      - name: emit SARIF
        run: hemlock scan examples/compromised-app --format sarif --fail-on never > hemlock.sarif
      - name: the pull request comment still renders
        run: |
          hemlock scan examples/compromised-app --format markdown --fail-on never > hemlock.md
          head -1 hemlock.md | grep -q '<!-- hemlock -->' || {
            echo "::error::markdown report lost its comment marker"
            exit 1
          }
          grep -q '| 🔴 |' hemlock.md || {
            echo "::error::markdown report has no critical row for the known-bad fixture"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: hemlock-sarif
          path: hemlock.sarif

  live-registry:
    # Kept separate so an upstream outage never blocks a pull request. This is
    # the job that notices when npm, PyPI or OSV changes a response shape.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: online rules still resolve
        run: hemlock scan examples/compromised-app --online --fail-on never
      - name: OSV still reports a known-malicious version
        # chalk 5.6.1 is the September 2025 compromise. If this stops being
        # reported, either OSV withdrew the record or our query broke.
        run: |
          mkdir -p /tmp/mal
          cat > /tmp/mal/package-lock.json <<'JSON'
          {"lockfileVersion":3,"packages":{
            "":{"dependencies":{"chalk":"5.6.1"}},
            "node_modules/chalk":{"version":"5.6.1","integrity":"sha512-x"}}}
          JSON
          hemlock scan /tmp/mal --online --format json --fail-on never > /tmp/mal/out.json
          python -c "
          import json,sys
          d=json.load(open('/tmp/mal/out.json'))
          assert d['malware'], 'OSV returned no malware record for chalk@5.6.1'
          print('malware reported:', d['malware'])
          "
