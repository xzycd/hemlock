[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hemlock-scan"
# Read from hemlock/__init__.py rather than written twice. The two drifted
# once already, which shipped a wheel labelled with the previous release.
dynamic = ["version"]
description = "Static supply-chain checks for npm and PyPI packages, lockfiles, provenance, and known malware."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["security", "supply-chain", "npm", "pypi", "typosquatting", "sbom", "sast"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

# No runtime dependencies, deliberately. See the README.
dependencies = []

[project.optional-dependencies]
dev = ["build==1.5.0", "pytest==9.1.1", "ruff==0.16.3"]

[project.scripts]
hemlock = "hemlock.cli:run"

[project.urls]
Homepage = "https://github.com/xzycd/hemlock"
Source = "https://github.com/xzycd/hemlock"
Issues = "https://github.com/xzycd/hemlock/issues"

[tool.hatch.version]
path = "hemlock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hemlock"]

[tool.hatch.build.targets.sdist]
include = ["hemlock", "tests", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 118
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Git and installer commands use argument lists with shell=False. Their
# executable names intentionally follow the user's PATH.
"hemlock/diff.py" = ["S603", "S607"]
"hemlock/history.py" = ["S603", "S607"]
"hemlock/update.py" = ["S603"]
# The random generator controls spinner wording and has no security role.
"hemlock/motion.py" = ["S311"]
# Tests use subprocesses and temporary files to exercise the CLI and git paths.
"tests/**.py" = ["S101", "S108", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
